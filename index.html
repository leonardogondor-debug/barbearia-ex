<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estilo livre</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header>
        <img src="img/logo-tablet.jpg" srcset="
                img/logo-celular.jpg 400w,
                img/logo-desktop.jpg 800w,
                img/logo-desktop.jpg 1200w" sizes="
                (max-width: 600px) 100vw,
                (max-width: 1200px) 50vw,
                33vw" alt="logo da barbearia">

        <!--menu-navegacao-->
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Barbearia Estilo Livre</a>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#">CASA</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">SOBRE-NOS</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">SERVIÇOS</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">DEPOIMENTOS</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">CONTATOS</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <section class="position-relative">
        <img src="img/banner-celular.jpg" srcset="
                img/banner-celular.jpg 400w,
                img/banner-tablet.jpg 800w,
                img/banner-dt.jpg 1200w" sizes="
                (max-width: 600px) 100vw,
                (max-width: 1200px) 50vw,
                33vw" class="img-fluid w-100" alt="Imagem de destaque">
        <div class="position-absolute top-0 start-0 w-100 h-100 bg-dark opacity-50"></div>
        <div class="position-absolute top-50 start-50 translate-middle text-center text-white">
            <h1 class="fw-bold">Estilo e Confiança</h1>
            <p class="lead">A barbearia que combina tradição e modernidade.</p>
            <ul>
                <li id="servicos">SERVICOS</li>
                <li id="contatos">CONTATOS</li>
            </ul>
        </div>
    </section>


</body>

</html>

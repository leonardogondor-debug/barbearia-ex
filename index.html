<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estilo livre</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="body-color-dar">
    <header class="bg-dark text-white">
        <div class="container">
            <div class="row">
                <div class="col-6 col-md-3">
                <img class="m-0" src="img/logo-tablet.jpg" srcset="
                img/logo-celular.jpg 400w,
                img/logo-desktop.jpg 800w,
                img/logo-desktop.jpg 1200w" sizes="
                (max-width: 600px) 100vw,
                (max-width: 1200px) 50vw,
                33vw" alt="logo da barbearia">
                </div>

                <!--menu-navegacao-->
                <div class="col-6 col-md-9 ms-md-auto text-md-end">
                <nav class="navbar bg-dark border-body d-md-flex justify-content-md-end" data-bs-theme="dark">
                    <div class="container">
                        <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse"
                            data-bs-target="#navbarTogglerDemo01" aria-controls="navbarTogglerDemo01"
                            aria-expanded="false" aria-label="Toggle navigation">
                            <span class="navbar-toggler-icon"></span>
                        </button>
                        <div class="collapse navbar-collapse" id="navbarTogglerDemo01">
                            <a class="navbar-brand text-md-end" href="#">BARBEARIA ESTILO LIVRE</a>
                            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                                <li class="nav-item">
                                    <a class="nav-link active" aria-current="page" href="#">CASA</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" href="#">SOBRE-NOS</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" href="#">SERVIÇOS</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" href="#">DEPOIMENTOS</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" href="#">CONTATO</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </nav>
                </div>
            </div>
        </div>
    </header>

    <section id="cada" class="banner position-relative">
        <div class="container">
        <img src="img/banner-dt.jpg" class="img-fluid w-100" alt="banner da barbearia">
        
        
        <div class="banner-content position-absolute top-50 star-50 text-center text-white">
            <div class="row">
                <div class="col-12">
            <h1 class="fw-bold">Babearia Estilo Livre</h1>
            </div>
            <div class="col-12">
            <p class="mb-3">Estilo, tradicao e qualidade</p>
            </div>
            <div class="col-12">
            <a href="#contato" class="btn btn-primary">Agendar Horário</a>
            </div>
            </div>
        </div>
        </div>
    </section>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

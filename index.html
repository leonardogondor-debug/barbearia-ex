<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estilo livre</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-dark">
    <header class="bg-dark text-white">
        <div class="container-fluid p-0">
            <div class="row">
                <div class="col-12 col-md-3 d-flex justify-content-center">
                    <img class="m-0 img-fluid" src="img/logo-tablet.jpg" srcset="
                img/logo-celular.jpg 400w,
                img/logo-desktop.jpg 800w,
                img/logo-desktop.jpg 1200w" sizes="
                (max-width: 600px) 100vw,
                (max-width: 1200px) 50vw,
                33vw" alt="logo da barbearia">
                </div>

                <!--menu-navegacao-->
                <div class="col-12 col-md-9 d-flex  d-flex justify-content-end align-items-start">
                    <nav class="navbar bg-dark border-body d-md-flex justify-content-md-end" data-bs-theme="dark">
                        <div class="container-fluid p-0">
                            <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse"
                                data-bs-target="#navbarTogglerDemo01" aria-controls="navbarTogglerDemo01"
                                aria-expanded="false" aria-label="Toggle navigation">
                                <span class="navbar-toggler-icon"></span>
                            </button>

                            <div class="collapse navbar-collapse" id="navbarTogglerDemo01">

                                <ul class="navbar-nav ms-md-auto mb-2 mb-lg-0">
                                    <a class="navbar-brand text-md-end" href="#">BARBEARIA ESTILO LIVRE</a>
                                    <li class="nav-item">
                                        <a class="nav-link active" aria-current="page" href="#">CASA</a>
                                    </li>
                                    <li class="nav-item">
                                        <a class="nav-link" href="#">SOBRE-NOS</a>
                                    </li>
                                    <li class="nav-item">
                                        <a class="nav-link" href="#">SERVIÇOS</a>
                                    </li>
                                    <li class="nav-item">
                                        <a class="nav-link" href="#">DEPOIMENTOS</a>
                                    </li>
                                    <li class="nav-item">
                                        <a class="nav-link" href="#">CONTATO</a>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </nav>
                </div>
            </div>
        </div>
    </header>

    <section id="casa" class="banner position-relative">

        <img src="img/banner-dt.jpg" class="img-fluid alt="banner da barbearia">


        <div class="banner-content position-absolute top-0 start-0 w-100 h-100 text-center text-white">
            <div class="container h-100">
                <div class="row h-100">
                    <div class="col-12 d-flex flex-column justify-content-start justify-content-md-start
                                align-items-center align-items-md-start text-center text-md-start mt-5">
                        <h1 class="fw-bold">Babearia Estilo Livre</h1>


                        <p class="mb-3">Estilo, tradicao e qualidade</p>


                        <a href="#contato" class="btn btn-primary">Agendar Horário</a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
